# XcodeGen spec. Generate the project on a Mac with: brew install xcodegen && xcodegen generate
name: Rev
options:
  bundleIdPrefix: com.trevorgerald
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RevCore:
    path: RevCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Rev:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: RevCore
        product: RevCore
    settings:
      base:
        PRODUCT_NAME: Rev
        PRODUCT_BUNDLE_IDENTIFIER: com.trevorgerald.rev
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Rev.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
