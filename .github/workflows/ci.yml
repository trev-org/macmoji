name: Rev CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project Rev.xcodeproj -scheme Rev -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests (RevCore)
        working-directory: RevCore
        run: swift test
      - name: Emoji data is up to date
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          node gen-emoji.mjs
          git diff --exit-code -- ../RevCore/Sources/RevCore/Resources/emoji.json
