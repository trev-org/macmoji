name: Rev CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project Rev.xcodeproj -scheme Rev -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          test -f build/Build/Products/Debug/Rev.app/Contents/Resources/Assets.car
      - name: Build SwiftPM app bundle
        run: |
          ARCHS="$(uname -m)" scripts/build-app.sh
          test -s build/Rev.app/Contents/Resources/MenuBarIcon.svg
          ICON_PATH="$PWD/build/Rev.app/Contents/Resources/MenuBarIcon.svg" xcrun swift -e '
          import AppKit
          import Foundation
          let path = ProcessInfo.processInfo.environment["ICON_PATH"]!
          let image = NSImage(contentsOfFile: path)
          precondition(image != nil, "MenuBarIcon.svg did not load")
          let icon = image!
          precondition(icon.size.width == 18 && icon.size.height == 18, "Unexpected icon size")
          icon.isTemplate = true
          precondition(icon.isTemplate, "Menu bar icon is not a template")
          precondition(icon.setName(NSImage.Name("MenuBarIcon")), "Could not register icon")
          precondition(NSImage(named: NSImage.Name("MenuBarIcon")) != nil, "Icon lookup failed")
          '
      - name: Unit tests (RevCore)
        working-directory: RevCore
        run: swift test
      - name: Emoji data is up to date
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          node gen-emoji.mjs
          git diff --exit-code -- ../RevCore/Sources/RevCore/Resources/emoji.json
